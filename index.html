<!DOCTYPE html>
<html>

<head>
    <title>Name Breaker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/favicon.webp">
    <script src="scripts/jquery.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/logic.js"></script>
    <script src="scripts/main.js"></script>
</head>

<body onload="drawIt()">
    <div id="container">
        <h1 id="game-title">
            NAME BREAKER
        </h1>
        <div id="ui-layer">
            <div id="scoreboard">
                <div class="stat">TIME: <span id="cas">00:00</span></div>
                <div class="stat">SCORE: <span id="points">0</span></div>
                <div class="stat">❤︎ <span id="lives">3</span></div>
            </div>
            <div id="controls">
                <button class="btn-bor" onclick="setDifficulty('BOR')">BOR</button>
                <button class="btn-tim" onclick="setDifficulty('TIM')">TIM</button>
                <button class="btn-vid" onclick="setDifficulty('VID')">VID</button>
                <button class="btn-restart" onclick="location.reload()">Restart</button>
            </div>
        </div>
        <div id="game-container"
            >
            <canvas id="canvas" style="display: block;"></canvas>

            <div id="gameOverScreen"
                style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; color: white;">
                <h1 style="color: #ff4444;">GAME OVER</h1>
                <p style="font-size: 20px;">SCORE: <span id="finalScore">0/0</span></p>
                <p style="font-size: 20px;">YOUR TIME: <span id="finalTime">00:00</span></p>
                <p style="font-size: 18px; color: #0affeb;">BEST TIME (Win only): <span
                        id="bestTimeDisplay">--:--</span></p>
                <button onclick="resetGame()"
                    style="margin-top: 20px; padding: 10px 30px; background: #0affeb; font-weight: bold; border: none; cursor: pointer;">RESTART</button>
            </div>
        </div>
        <div class="info-container">
            <div class="info-icon">ⓘ</div>
            <div class="info-text">Nik Bačar 4.RB</div>
        </div>
    </div>
</body>

</html>
